name: PR Review Reminder

on:
  schedule:

    # Every 30 minutes from 08:00 through 16:30.
    - cron: "*/15 6-19 * * *"

    # Exactly 17:00.
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-reminder
  cancel-in-progress: false

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

          EVENT_NAME: schedule
          TEAM_FILE: .github/pr-review-team.txt

        run: |
          python3 .github/scripts/pr_review_bot.py